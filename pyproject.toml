[project]
name = "gnoci-v2"
version = "0.1.0"
description = "Simulation, Training and control code for gnoci v2"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
gnoci-v2 = "gnoci_v2:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
sim = [
    "imageio-ffmpeg>=0.6.0",
    # brax<=0.14.2 PPO calls jax.device_put_replicated, removed in jax 0.10.
    "jax[cuda]<0.10",
    "playground>=0.2.0",
]
control = []

[tool.uv]
default-groups = ["dev", "sim"]
